<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地工作台 | DecisioWorks</title><link rel="icon" href="../assets/decisioworks-logo.png"><link rel="stylesheet" href="../extensions/site.css"></head><body>
<header class="topbar"><a class="brand" href="../resources/"><img src="../assets/decisioworks-logo.png" alt="DecisioWorks">DecisioWorks / 工作台</a><nav><a href="../resources/">资源中心</a><a href="../resources/#learn">使用教学</a><a href="../resources/LOCAL_WORKBENCH.md">本地启动</a></nav></header>
<main class="layout"><div class="intro"><div><div class="eyebrow">PRODUCTION DECISION WORKBENCH</div><h1>从业务数据到运行证据</h1><p class="muted" id="caseQuestion"></p></div><div id="connection" class="status" role="status">正在读取环境状态</div></div>
<div class="toolbar"><label class="grow">场景<select id="dataset" aria-label="选择场景"></select></label><div class="download-row"><button id="refresh">重新连接</button><button id="diagnose">检查数据</button></div></div>
<div id="notice" role="alert"></div><nav class="tabs" role="tablist" aria-label="工作台视图"><button role="tab" aria-selected="true" data-tab="data">数据诊断</button><button role="tab" aria-selected="false" data-tab="flow">流程与参数</button><button role="tab" aria-selected="false" data-tab="rules">经验与规则</button><button role="tab" aria-selected="false" data-tab="results">运行与对比</button><button role="tab" aria-selected="false" data-tab="agent">Agent 任务包</button></nav>
<section id="data" role="tabpanel"><div id="facts" class="facts"></div><div class="toolbar"><label class="grow">输入数据表<select id="table"></select></label><label>每页<select id="pageSize"><option>20</option><option>50</option><option>100</option></select></label></div><div class="table-wrap" id="inputTable"></div><div class="pagination"><span id="rowCount" class="grow"></span><button id="prev" aria-label="上一页">←</button><span id="pageLabel"></span><button id="next" aria-label="下一页">→</button></div><div class="section"><h2>业务关系</h2><div id="relations"></div></div><div class="section"><div class="title-row"><h2>校验记录</h2><button id="exportDiagnosis">下载诊断记录</button></div><p id="diagnosisScope" class="muted"></p><div id="checks" class="table-wrap"></div></div></section>
<section id="flow" role="tabpanel" hidden><div class="title-row"><h2>能力编排配方</h2><div class="download-row"><button id="resetFlow">恢复场景配方</button><button id="exportRecipe">下载 recipe.json</button></div></div><div id="flowNodes" class="flow"></div><div id="optionalActions"></div><p id="flowErrors" role="alert" class="error-line"></p><div class="section"><h2>运行资源与目标</h2><p id="profile" class="muted"></p><div id="controls" class="form-grid"></div><h3>目标权重</h3><div id="objectives" class="form-grid"></div><p id="configErrors" class="error-line" role="alert"></p></div><details><summary>配方 JSON</summary><pre id="recipePreview"></pre></details></section>
<section id="rules" role="tabpanel" hidden><h2>经验、偏好与规则</h2><div id="ruleList" class="rule"></div></section>
<section id="results" role="tabpanel" hidden><div class="title-row"><h2>基线与调整后运行</h2><div class="download-row"><button id="baseline" class="primary">运行基线</button><button id="rerun">调整后重算</button><button id="exportEvidence">下载运行证据</button></div></div><div id="runState" role="status"></div><div class="run-summary" id="runSummary"></div><div class="section"><h2>指标与配置对比</h2><div id="comparison"></div></div><div class="section"><h2>实际动作记录</h2><div id="trace"></div></div><div class="section"><h2>计划结果</h2><label>结果版本<select id="resultVersion"><option value="baseline">基线</option><option value="candidate">调整后</option></select></label><div class="table-wrap" id="outputTable"></div><div class="pagination"><span class="grow" id="outputCount"></span><button id="outPrev" aria-label="结果上一页">←</button><span id="outPage"></span><button id="outNext" aria-label="结果下一页">→</button></div></div></section>
<section id="agent" role="tabpanel" hidden><h2>AI Agent 任务包</h2><label>任务目标<textarea id="intent">核对所选场景的数据关系，以当前配方完成基线求解，比较参数调整前后的结果，并提供可复核的运行记录。</textarea></label><div class="toolbar"><button id="makeTask" class="primary">生成任务包</button><button id="exportTask" disabled>下载任务包 ZIP</button></div><div id="taskFiles"></div><pre id="taskPreview" class="task-preview">尚未生成任务包</pre></section>
<footer>Production Decision Sandbox · 本地工作台 v0.2.0</footer></main><script type="module" src="app.js"></script></body></html>
